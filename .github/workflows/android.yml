name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de la lógica (core)
        run: ./gradlew :core:test --no-daemon
      - name: Compilar APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Copiar APK
        run: cp app/build/outputs/apk/release/app-release.apk Asalariado.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Asalariado-apk
          path: Asalariado.apk
