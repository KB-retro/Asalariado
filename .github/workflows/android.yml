name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de la lógica (core)
        run: ./gradlew :core:test --no-daemon
      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/asalariado.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/asalariado.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto KEYSTORE_BASE64: el APK se firma con una clave temporal y no se podrá instalar encima de otra versión."
          fi
      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Copiar APK
        run: cp app/build/outputs/apk/release/app-release.apk Asalariado.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Asalariado-apk
          path: Asalariado.apk

  # Capturas de las pantallas en un emulador, para revisar el aspecto en cada cambio.
  screenshots:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capturas en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
            mkdir -p screens && find app/build/outputs -name '*.png' -path '*additional_output*' -exec cp {} screens/ \;
            ls screens
      - name: Guardar capturas reducidas en la rama
        if: github.event_name == 'push'
        run: |
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          mkdir -p docs/capturas
          rm -f docs/capturas/*.jpg
          for f in $(find screens -name '*.png' | sort); do
            convert "$f" -resize 540x -quality 72 "docs/capturas/$(basename "$f" .png).jpg"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/capturas
          git commit -m "Capturas de pantalla [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: screens
